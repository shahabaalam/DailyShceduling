<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Scheduling - Sign In</title>
  <link rel="icon" href="/assets/icons/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/icons/logo.png" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <img class="app-logo" src="/assets/icons/logo.png" alt="Daily Scheduling logo" />
      <p class="eyebrow">Daily Scheduling</p>
      <h1 id="login-title">Plan your day, clearly.</h1>
      <p class="subtitle">
        Sign in with Google to load your tasks, timeline, and secure encrypted data.
      </p>

      <button id="google-login" class="google-btn" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="google-icon">
          <path fill="#EA4335" d="M12 10.2v3.96h5.6c-.24 1.28-.96 2.36-2 3.08l3.24 2.52c1.88-1.72 2.96-4.24 2.96-7.24 0-.72-.08-1.44-.2-2.12H12z"/>
          <path fill="#34A853" d="M12 22c2.68 0 4.92-.88 6.56-2.4l-3.24-2.52c-.88.6-2 .96-3.32.96-2.56 0-4.72-1.72-5.52-4.04H3.16v2.56A9.99 9.99 0 0 0 12 22z"/>
          <path fill="#4A90E2" d="M6.48 14c-.2-.6-.32-1.24-.32-2s.12-1.4.32-2V7.44H3.16A9.99 9.99 0 0 0 2 12c0 1.6.4 3.12 1.16 4.56L6.48 14z"/>
          <path fill="#FBBC05" d="M12 5.96c1.44 0 2.72.48 3.72 1.44l2.76-2.76C16.92 3.2 14.68 2 12 2A9.99 9.99 0 0 0 3.16 7.44L6.48 10C7.28 7.68 9.44 5.96 12 5.96z"/>
        </svg>
        Continue with Google
      </button>

      <p id="login-message" class="login-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
